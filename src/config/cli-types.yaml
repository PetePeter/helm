  spawnCommand: codex
  resumeCommand: codex resume {cliSessionName}
  continueCommand: codex resume --last
  initialPrompt:
    - label: Helm session init
      sequence: Call session_info to get Helm MCP initial information.{Enter}
  initialPromptDelay: 2000
  pasteMode: pty
  submitSuffix: \r
  largeTextAsTempFile: true
  helmActions:
    clear: /new{Enter}
    compact: /compact{Enter}
    export: ''
  hooks:
    provider: codex
    configPath: ~/.codex/hooks.json
    events: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, PreCompact, Stop]
    denyRules:
      - tools: [AskUserQuestion, ask_user]
        onlyWhenAway: true
        reason: 'The user is away from the desk (phone or Telegram). Ask them with the Helm MCP tool chat_send instead — it reaches their phone and they will reply through it.'
      - tools: [Artifact, artifact]
        reason: 'Helm owns artifacts for this session. Use the Helm MCP tool session_artifact_create instead so the report appears in Helm''s viewer.'
      - tools: [Bash, bash, shell, Shell, local_shell]
        commandPattern: '\brm\s+(-[a-zA-Z]*r[a-zA-Z]*f|-[a-zA-Z]*f[a-zA-Z]*r)\b'
        reason: 'Guardrail: destructive rm -rf is blocked for Helm-spawned sessions. Ask the user to run it themselves at the terminal.'
      - tools: [Write, Edit, NotebookEdit, write, edit, apply_patch]
        outsideSessionDir: true
        reason: 'Writes are limited to the session''s working directory; the user reviews anything outside it in person.'

