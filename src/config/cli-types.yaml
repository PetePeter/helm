# Shipped CLI type defaults — seeded into <appData>/Helm/config/cli-types.yaml
# on a fresh install. Existing files are never overwritten (seedConfigIfNeeded).
#
# Keys are the immutable UUID identity; edit freely in the Tool Editor, but do
# not re-key an entry — sessions persist the id, not the name.
0c0e2f4a-62a9-4a7d-9d4a-1a5a1f0b4c11:
  id: 0c0e2f4a-62a9-4a7d-9d4a-1a5a1f0b4c11
  name: Claude Code
  displayName: Claude Code
  spawnCommand: claude --session-id {cliSessionName}
  resumeCommand: claude --resume={cliSessionName}
  continueCommand: claude --continue
  initialPrompt:
    - label: Helm session init
      sequence: Call session_info to get Helm MCP initial information.{Enter}
  initialPromptDelay: 2000
  pasteMode: pty
  submitSuffix: \r
  largeTextAsTempFile: true
  helmActions:
    clear: /clear{Enter}
    compact: /compact $instructions{Enter}
    export: /export $path{Enter} {Wait 5000}

3b7d9c1e-5f42-4b8e-9a3c-2d6e8f0a7b22:
  id: 3b7d9c1e-5f42-4b8e-9a3c-2d6e8f0a7b22
  name: Codex
  displayName: Codex
  spawnCommand: codex
  resumeCommand: codex resume {cliSessionName}
  continueCommand: codex resume --last
  initialPrompt:
    - label: Helm session init
      sequence: Call session_info to get Helm MCP initial information.{Enter}
  initialPromptDelay: 2000
  pasteMode: pty
  submitSuffix: \r
  largeTextAsTempFile: true
  helmActions:
    clear: /new{Enter}
    compact: /compact{Enter}
    export: ''

5e2a8d63-9c17-4f05-b6d1-3a9c4e7b1d33:
  id: 5e2a8d63-9c17-4f05-b6d1-3a9c4e7b1d33
  name: GitHub Copilot CLI
  displayName: GitHub Copilot CLI
  spawnCommand: copilot --name={cliSessionName}
  resumeCommand: copilot --resume={cliSessionName}
  continueCommand: copilot --continue
  initialPrompt:
    - label: Helm session init
      sequence: Call session_info to get Helm MCP initial information.{Enter}
  initialPromptDelay: 2000
  pasteMode: pty
  submitSuffix: \r
  largeTextAsTempFile: true
  helmActions:
    clear: /clear{Enter}
    compact: ''
    export: ''

# Plain shell — the escape hatch when you want a terminal rather than an agent.
7f4b0a25-8e36-4c19-a2f7-4b1d6c9e2a44:
  id: 7f4b0a25-8e36-4c19-a2f7-4b1d6c9e2a44
  name: cmd
  displayName: cmd
  spawnCommand: cmd.exe
  initialPrompt: []
  initialPromptDelay: 2000
  pasteMode: pty
  submitSuffix: \r
  helmPreambleForInterSession: false
