# Shipped CLI type defaults — seeded into <appData>/Helm/config/cli-types.yaml
# on a fresh install. Existing files are never overwritten (seedConfigIfNeeded).
#
# Keys are the immutable UUID identity; edit freely in the Tool Editor, but do
# not re-key an entry — sessions persist the id, not the name.
0c0e2f4a-62a9-4a7d-9d4a-1a5a1f0b4c11:
  id: 0c0e2f4a-62a9-4a7d-9d4a-1a5a1f0b4c11
  name: Claude Code
  displayName: Claude Code
  spawnCommand: claude --session-id {cliSessionName}
  resumeCommand: claude --resume={cliSessionName}
  continueCommand: claude --continue
  initialPrompt:
    - label: Helm session init
      sequence: Call session_info to get Helm MCP initial information.{Enter}
  initialPromptDelay: 2000
  pasteMode: pty
  submitSuffix: \r
  largeTextAsTempFile: true
  helmActions:
    clear: /clear{Enter}
    compact: /compact $instructions{Enter}
    export: /export $path{Enter} {Wait 5000}
  hooks:
    provider: claude
    configPath: ~/.claude/settings.json
    # StopFailure is Claude's alone — the turn died on an API error (the
    # usage-limit stall), reported as fact instead of guessed from silence.
    # Codex and Copilot have no equivalent event, so they never register one.
    events: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, PreCompact, Stop, StopFailure]
    # G2 PreToolUse deny rules. The reason is fed back to the model, so it must
    # NAME the Helm alternative — that redirect is the feature. Unknown tools,
    # malformed rules and internal errors always ALLOW (fail open).
    denyRules:
      - tools: [AskUserQuestion]
        onlyWhenAway: true
        reason: 'The user is away from the desk (phone or Telegram). Ask them with the Helm MCP tool chat_send instead — it reaches their phone and they will reply through it.'
      - tools: [Artifact]
        reason: 'Helm owns artifacts for this session. Use the Helm MCP tool session_artifact_create instead so the report appears in Helm''s viewer.'
      - tools: [Bash, bash, shell, Shell]
        commandPattern: '\brm\s+(-[a-zA-Z]*r[a-zA-Z]*f|-[a-zA-Z]*f[a-zA-Z]*r)\b'
        reason: 'Guardrail: destructive rm -rf is blocked for Helm-spawned sessions. Ask the user to run it themselves at the terminal.'
      - tools: [Write, Edit, NotebookEdit, write, edit, apply_patch]
        outsideSessionDir: true
        reason: 'Writes are limited to the session''s working directory; the user reviews anything outside it in person.'

3b7d9c1e-5f42-4b8e-9a3c-2d6e8f0a7b22:
