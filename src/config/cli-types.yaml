# Shipped CLI type defaults — seeded into <appData>/Helm/config/cli-types.yaml
# on a fresh install. Existing files are never overwritten (seedConfigIfNeeded).
#
# Keys are the immutable UUID identity; edit freely in the Tool Editor, but do
# not re-key an entry — sessions persist the id, not the name.
0c0e2f4a-62a9-4a7d-9d4a-1a5a1f0b4c11:
  id: 0c0e2f4a-62a9-4a7d-9d4a-1a5a1f0b4c11
  name: Claude Code
  displayName: Claude Code
  spawnCommand: claude --session-id {cliSessionName}
  resumeCommand: claude --resume={cliSessionName}
  continueCommand: claude --continue
  initialPrompt:
    - label: Helm session init
      sequence: Call session_info to get Helm MCP initial information.{Enter}
  initialPromptDelay: 2000
  pasteMode: pty
  submitSuffix: \r
  largeTextAsTempFile: true
  helmActions:
    clear: /clear{Enter}
    compact: /compact $instruction{Enter}
    export: /export $path{Enter} {Wait 5000}
  # Model context window in tokens: turns the phone's "ctx 60.1k" reply badge
  # into "ctx 60.1k · 30%". Claude's log names no window, so it is stated here
  # (raise it for a 1M-context model). Codex logs its own and needs none.
  contextWindow: 200000
  # Which CLI family this tool speaks — the first-class provider mapping the
  # Tool mapping dropdown edits (auto-migrated onto older configs on load).
  provider: claude
  hooks:
    provider: claude
    configPath: ~/.claude/settings.json
    # StopFailure is Claude's alone — the turn died on an API error (the
    # usage-limit stall), reported as fact instead of guessed from silence.
    # Codex and Copilot have no equivalent event, so they never register one.
    events: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, PreCompact, Stop, StopFailure]
    # G2 PreToolUse deny rules. The reason is fed back to the model, so it must
    # NAME the Helm alternative — that redirect is the feature. Unknown tools,
    # malformed rules and internal errors always ALLOW (fail open).
    denyRules:
      - tools: [AskUserQuestion]
        onlyWhenAway: true
        reason: 'The user is away from the desk (phone or Telegram). Ask them with the Helm MCP tool chat_send instead — it reaches their phone and they will reply through it.'
      - tools: [Artifact]
        reason: 'Helm owns artifacts for this session. Use the Helm MCP tool session_artifact_create instead so the report appears in Helm''s viewer.'
      - tools: [Bash, bash, shell, Shell]
        commandPattern: '\brm\s+(-[a-zA-Z]*r[a-zA-Z]*f|-[a-zA-Z]*f[a-zA-Z]*r)\b'
        reason: 'Guardrail: Helm blocks Bash/shell tool calls whose command text contains rm with combined -r and -f flags (for example, rm -rf or rm -fr). This coarse text match can also block quoted mentions. Ask the user to run the intended deletion at the terminal.'

3b7d9c1e-5f42-4b8e-9a3c-2d6e8f0a7b22:
  id: 3b7d9c1e-5f42-4b8e-9a3c-2d6e8f0a7b22
  name: Codex
  displayName: Codex
  spawnCommand: codex
  # Resume by the thread UUID codex reports in its hook session_id: resume by
  # NAME refuses once history spans several pages ("Cannot verify a unique
  # session label"). Needs the hooks block; without a captured id the literal
  # placeholder reaches codex and the resume fails visibly.
  # The rename stays for codex's own picker; the helm- prefix keeps that name
  # from parsing as a UUID.
  resumeCommand: codex resume {cliThreadId}
  continueCommand: codex resume --last
  renameCommand: /rename helm-{cliSessionName}
  initialPrompt:
    - label: Helm session init
      sequence: Call session_info to get Helm MCP initial information.{Enter}
  initialPromptDelay: 2000
  pasteMode: pty
  submitSuffix: \r
  largeTextAsTempFile: true
  helmActions:
    clear: /new{Enter}
    compact: /compact{Enter}
    export: ''
  provider: codex
  hooks:
    provider: codex
    configPath: ~/.codex/hooks.json
    events: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, PreCompact, Stop]
    denyRules:
      - tools: [AskUserQuestion, ask_user]
        onlyWhenAway: true
        reason: 'The user is away from the desk (phone or Telegram). Ask them with the Helm MCP tool chat_send instead — it reaches their phone and they will reply through it.'
      - tools: [Artifact, artifact]
        reason: 'Helm owns artifacts for this session. Use the Helm MCP tool session_artifact_create instead so the report appears in Helm''s viewer.'
      - tools: [Bash, bash, shell, Shell, local_shell]
        commandPattern: '\brm\s+(-[a-zA-Z]*r[a-zA-Z]*f|-[a-zA-Z]*f[a-zA-Z]*r)\b'
        reason: 'Guardrail: Helm blocks Bash/shell tool calls whose command text contains rm with combined -r and -f flags (for example, rm -rf or rm -fr). This coarse text match can also block quoted mentions. Ask the user to run the intended deletion at the terminal.'

5e2a8d63-9c17-4f05-b6d1-3a9c4e7b1d33:
  id: 5e2a8d63-9c17-4f05-b6d1-3a9c4e7b1d33
  name: GitHub Copilot CLI
  displayName: GitHub Copilot CLI
  spawnCommand: copilot --name={cliSessionName}
  resumeCommand: copilot --resume={cliSessionName}
  continueCommand: copilot --continue
  initialPrompt:
    - label: Helm session init
      sequence: Call session_info to get Helm MCP initial information.{Enter}
  initialPromptDelay: 2000
  pasteMode: pty
  submitSuffix: \r
  largeTextAsTempFile: true
  helmActions:
    clear: /clear{Enter}
    compact: /compact $instruction{Enter}
    export: /export $path{Enter} {Wait 5000}
  provider: copilot
  hooks:
    provider: copilot
    configPath: ~/.copilot/hooks/helm.json
    events: [sessionStart, userPromptSubmitted, preToolUse, postToolUse, preCompact, agentStop]
    denyRules:
      - tools: [AskUserQuestion, askUserQuestion]
        onlyWhenAway: true
        reason: 'The user is away from the desk (phone or Telegram). Ask them with the Helm MCP tool chat_send instead — it reaches their phone and they will reply through it.'
      - tools: [Artifact, artifact]
        reason: 'Helm owns artifacts for this session. Use the Helm MCP tool session_artifact_create instead so the report appears in Helm''s viewer.'
      - tools: [Bash, bash, shell, Shell]
        commandPattern: '\brm\s+(-[a-zA-Z]*r[a-zA-Z]*f|-[a-zA-Z]*f[a-zA-Z]*r)\b'
        reason: 'Guardrail: Helm blocks Bash/shell tool calls whose command text contains rm with combined -r and -f flags (for example, rm -rf or rm -fr). This coarse text match can also block quoted mentions. Ask the user to run the intended deletion at the terminal.'

# Plain shell — the escape hatch when you want a terminal rather than an agent.
7f4b0a25-8e36-4c19-a2f7-4b1d6c9e2a44:
  id: 7f4b0a25-8e36-4c19-a2f7-4b1d6c9e2a44
  name: cmd
  displayName: cmd
  spawnCommand: cmd.exe
  initialPrompt: []
  initialPromptDelay: 2000
  pasteMode: pty
  submitSuffix: \r
  helmPreambleForInterSession: false

